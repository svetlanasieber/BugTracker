# ==========================================
# Project Service Microservice Configuration
# ==========================================

spring.application.name=Project Service

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8081

# ==========================================
# DATABASE CONFIGURATION (Separate Database)
# ==========================================
# MySQL Database Connection for Project Service
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/project_service_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=password

# JPA and Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.com.bugtracker.projectservice=INFO
logging.level.org.hibernate.SQL=INFO

# ==========================================
# API DOCUMENTATION (Swagger)
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.bugtracker.projectservice.controller

# ==========================================
# MICROSERVICE CONFIGURATION
# ==========================================
# Service discovery and inter-service communication settings
spring.profiles.active=microservice



