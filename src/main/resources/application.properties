

spring.application.name=Bug Tracker Application


server.port=8080


# MySQL Database Connection
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bug_tracker_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=username  
spring.datasource.password=password

# JPA and Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# Using JPA DDL auto instead for simplicity in university project
spring.flyway.enabled=false
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true


# MVC Configuration
spring.mvc.hiddenmethod.filter.enabled=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf Configuration (disable cache for development)
spring.thymeleaf.cache=false


# Allow circular dependencies (for complex dependency injection)
spring.main.allow-circular-references=true


app.file-storage.upload-dir=${user.home}/bugtracker/uploads
app.file-storage.max-file-size=10485760
app.file-storage.allowed-extensions=jpg,jpeg,png,gif,pdf,txt,doc,docx

# Legacy property (will be deprecated)
app.upload-dir=${app.file-storage.upload-dir}


logging.level.org.springframework.security=INFO
logging.level.com.bugtracker=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.persister.entity=ERROR


# Email Configuration (for notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:demo@bugtracker.com}
spring.mail.password=${MAIL_PASSWORD:demo_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Notification service integration
notification.service.enabled=true


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.bugtracker.bugtracker.web.controller
