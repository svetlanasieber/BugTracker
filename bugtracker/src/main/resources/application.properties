# ==========================================
# Bug Tracker Application Configuration
# Spring Boot Advanced - University Project
# ==========================================

spring.application.name=Bug Tracker Application

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080

# ==========================================
# DATABASE CONFIGURATION (MySQL + Hibernate)
# ==========================================
# MySQL Database Connection
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bug_tracker_main_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=

# JPA and Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# SERVER SETTINGS (HTTP Only - SSL Disabled for Development)
# ===============================
# SSL Configuration disabled for development/learning purposes
# To enable HTTPS, uncomment and configure the following:
# server.port=8443
# server.ssl.key-store-type=PKCS12
# server.ssl.key-store=classpath:bugtracker.p12
# server.ssl.key-store-password=password
# server.ssl.key-alias=bugtracker


# ===============================
# JWT Settings
# ===============================
# Secret key for signing JWTs. This should be a long, random, base64-encoded string in production.
# Generate one here: https://www.allkeysgenerator.com/Random/Security-Encryption-Key-Generator.aspx
jwt.secret-key=bXlTdXBlclNlY3JldEtleUZvckJ1Z1RyYWNrZXJBcHBsaWNhdGlvblRoYXRJc0xvbmdFbm91Z2hCbGFoQmxhaA==
# Expiration time in milliseconds (24 hours = 86400000)
jwt.expiration-time-ms=86400000

# ==========================================
# DATABASE MIGRATION (Flyway) - DISABLED FOR DEVELOPMENT
# ==========================================
# Using JPA DDL auto instead for simplicity in university project
spring.flyway.enabled=false
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true

# ==========================================
# WEB CONFIGURATION
# ==========================================
# MVC Configuration
spring.mvc.hiddenmethod.filter.enabled=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf Configuration (disable cache for development)
spring.thymeleaf.cache=false

# ==========================================
# SPRING CONFIGURATION
# ==========================================
# Allow circular dependencies (for complex dependency injection)
spring.main.allow-circular-references=true

# ==========================================
# FILE STORAGE CONFIGURATION
# ==========================================
app.file-storage.upload-dir=${user.home}/bugtracker/uploads
app.file-storage.max-file-size=10485760
app.file-storage.allowed-extensions=jpg,jpeg,png,gif,pdf,txt,doc,docx

# Legacy property (will be deprecated)
app.upload-dir=${app.file-storage.upload-dir}

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.com.bugtracker=INFO
logging.level.com.bugtracker.config.InitialDataSeeder=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.persister.entity=ERROR

# ==========================================
# NOTIFICATION SERVICE CONFIGURATION
# ==========================================
# Email Configuration (for notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:demo@bugtracker.com}
spring.mail.password=${MAIL_PASSWORD:demo_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Notification service integration
notification.service.enabled=true

# ==========================================
# API DOCUMENTATION (Swagger)
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.bugtracker.web.controller
