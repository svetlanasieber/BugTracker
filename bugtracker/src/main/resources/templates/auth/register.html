<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Tracker - Register</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .register-container {
            max-width: 550px;
            width: 100%;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        
        .register-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }
        
        .register-header {
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
        }
        
        .register-header h3 {
            position: relative;
            z-index: 2;
            margin: 0;
            font-weight: 800;
            font-size: 2rem;
        }
        
        .register-header p {
            position: relative;
            z-index: 2;
            margin: 0.75rem 0 0 0;
            opacity: 0.95;
            font-weight: 500;
        }
        
        .register-body {
            padding: 2.5rem 2rem;
        }
        
        .brand-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .form-label {
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.5rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-group {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 0.5rem;
        }
        
        .input-group-text {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 2px solid #e0f2fe;
            border-right: none;
            color: #0ea5e9;
        }
        
        .form-control, .form-select {
            border: 2px solid #e0f2fe;
            border-left: none;
            padding: 0.75rem 1rem;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #0ea5e9;
            box-shadow: none;
            background: #f0f9ff;
        }
        
        .register-btn {
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
            transition: all 0.3s ease;
        }
        
        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.4);
        }
        
        .register-footer {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            padding: 1.75rem 2rem;
            text-align: center;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .register-footer a {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 600;
        }
        
        .register-footer a:hover {
            color: #0284c7;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container register-container">
        <div class="card register-card">
            <div class="register-header text-white">
                <i class="bi bi-bug-fill brand-icon"></i>
                <h3>Bug Tracker</h3>
                <p>Create a new account</p>
            </div>
            <div class="register-body">
                <div th:if="${registrationError}" class="alert alert-danger" th:text="${registrationError}"></div>
                
                <form th:action="@{/auth/register}" method="post" th:object="${userRegister}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}"/>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">
                                <i class="bi bi-person me-1"></i>First Name
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="firstName" th:field="*{firstName}" 
                                       required placeholder="John">
                            </div>
                            <div class="text-danger small" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>
                        
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">
                                <i class="bi bi-person me-1"></i>Last Name
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="lastName" th:field="*{lastName}" 
                                       required placeholder="Doe">
                            </div>
                            <div class="text-danger small" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="bi bi-at me-1"></i>Username
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-at"></i></span>
                            <input type="text" class="form-control" id="username" th:field="*{username}" 
                                   required placeholder="johndoe123">
                        </div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="bi bi-envelope me-1"></i>Email Address
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" th:field="*{email}" 
                                   required placeholder="john.doe@example.com">
                        </div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="team" class="form-label">
                            <i class="bi bi-people me-1"></i>Team Role (Optional)
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-people"></i></span>
                            <select class="form-select" id="team" th:field="*{team}">
                                <option value="">Select a team role...</option>
                                <option th:each="role : ${T(com.bugtracker.model.enums.TeamRole).values()}" 
                                        th:value="${role.name()}" 
                                        th:text="${role.displayName}">
                                </option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-key me-1"></i>Password
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" th:field="*{password}" 
                                   required placeholder="Choose a strong password">
                        </div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">
                            <i class="bi bi-check-circle me-1"></i>Confirm Password
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-check-circle"></i></span>
                            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" 
                                   required placeholder="Confirm your password">
                        </div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn register-btn text-white">
                            <i class="bi bi-person-plus me-2"></i>Create Account
                        </button>
                    </div>
                </form>
            </div>
            <div class="register-footer">
                <div class="d-flex justify-content-between align-items-center">
                    <a th:href="@{/landing}" class="text-decoration-none">
                        <i class="bi bi-house me-1"></i>Home
                    </a>
                    <span>Already have an account? <a th:href="@{/auth/login}" class="text-decoration-none fw-semibold">Sign In</a></span>
                </div>
            </div>
        </div>
    </div>
    
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
