<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Bug - Bug Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-bug-fill me-2"></i>Bug Tracker
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/projects}">
                            <i class="bi bi-folder me-1"></i>Projects
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/bugs}">
                            <i class="bi bi-bug me-1"></i>Bugs
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAuthority('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/users}">
                            <i class="bi bi-people me-1"></i>User Management
                        </a>
                    </li>
                </ul>
                <div class="d-flex">
                                <div class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle me-1"></i>
                    <span sec:authentication="name">Username</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown" style="z-index: 1050;">
                            <li><a class="dropdown-item" th:href="@{/profile}">Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button class="dropdown-item" type="submit">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card shadow-lg fade-in">
                    <div class="card-header">
                        <h2 class="h4 mb-0 gradient-text">
                            <i class="bi bi-bug-fill me-2"></i>Report New Bug
                        </h2>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/bugs/create}" method="post" th:object="${bugAdd}">
                            <!-- Project Selection -->
                            <div class="mb-3">
                                <label for="projectId" class="form-label">Project <span class="text-danger">*</span></label>
                                <select id="projectId" th:field="*{projectId}" class="form-select" required>
                                    <option value="">Select Project</option>
                                    <option th:each="projectOption : ${projects}" 
                                            th:value="${projectOption.id}" 
                                            th:text="${projectOption.name}">
                                        Project Name
                                    </option>
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('projectId')}" th:errors="*{projectId}"></div>
                            </div>
                            
                            <!-- Bug Title -->
                            <div class="mb-3">
                                <label for="title" class="form-label">Bug Title <span class="text-danger">*</span></label>
                                <input type="text" id="title" th:field="*{title}" class="form-control" 
                                       required minlength="3" maxlength="100"
                                       placeholder="Enter a concise title that describes the bug">
                                <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                            </div>
                            
                            <!-- Bug Description -->
                            <div class="mb-3">
                                <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="4" required
                                          placeholder="Provide a detailed description of the bug"></textarea>
                                <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                            </div>
                            
                            <!-- Steps to Reproduce -->
                            <div class="mb-3">
                                <label for="stepsToReproduce" class="form-label">Steps to Reproduce</label>
                                <textarea id="stepsToReproduce" th:field="*{stepsToReproduce}" class="form-control" rows="4"
                                          placeholder="List detailed steps to reproduce this bug (one step per line)"></textarea>
                                <div class="form-text">Include all necessary steps to consistently reproduce the bug.</div>
                                <div class="text-danger" th:if="${#fields.hasErrors('stepsToReproduce')}" th:errors="*{stepsToReproduce}"></div>
                            </div>
                            
                            <!-- Priority Selection -->
                            <div class="mb-3">
                                <label for="priority" class="form-label">Priority <span class="text-danger">*</span></label>
                                <select id="priority" th:field="*{priority}" class="form-select" required>
                                    <option th:each="priorityOption : ${priorities}" 
                                            th:value="${priorityOption}" 
                                            th:text="${priorityOption}">
                                        Priority Level
                                    </option>
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></div>
                            </div>
                            
                            <!-- Assign To (Optional) -->
                            <div class="mb-4">
                                <label for="assignedToId" class="form-label">Assign To</label>
                                <select id="assignedToId" th:field="*{assignedToId}" class="form-select">
                                    <option value="">Unassigned</option>
                                    <option th:each="user : ${users}" 
                                            th:value="${user.id}" 
                                            th:text="${user.firstName + ' ' + user.lastName}">
                                        User Name
                                    </option>
                                </select>
                            </div>
                            
                            <!-- Form Controls -->
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/bugs}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left me-1"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle me-1"></i> Submit Bug Report
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 Bug Tracker. All rights reserved.</p>
        </div>
    </footer>

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
