<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User - Bug Tracker Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 2rem auto;
        }
        .create-user-card {
            border: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            overflow: hidden;
        }
        .create-user-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            text-align: center;
        }
        .create-user-body {
            padding: 2rem;
        }
        .btn-create {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
        }
        .btn-back {
            background: #6c757d;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
        }
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container admin-container">
        <div class="card create-user-card">
            <div class="create-user-header text-white">
                <i class="bi bi-person-plus-fill" style="font-size: 3rem;"></i>
                <h3 class="mt-2 mb-1">Create New User</h3>
                <p class="mb-0">Add a new user to the system</p>
            </div>
            <div class="create-user-body">
                <!-- Success/Error Messages -->
                <div id="message-container"></div>
                
                <form id="createUserForm">
                    <!-- Name Fields -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label fw-semibold">
                                <i class="bi bi-person me-1"></i>First Name
                            </label>
                            <input type="text" class="form-control" id="firstName" name="firstName" required>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label fw-semibold">
                                <i class="bi bi-person me-1"></i>Last Name
                            </label>
                            <input type="text" class="form-control" id="lastName" name="lastName" required>
                        </div>
                    </div>
                    
                    <!-- Email Field -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            <i class="bi bi-envelope me-1"></i>Email Address
                        </label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <!-- Password Field -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            <i class="bi bi-lock me-1"></i>Password
                        </label>
                        <input type="password" class="form-control" id="password" name="password" required>
                        <div class="form-text">Password should be at least 6 characters long</div>
                    </div>
                    
                    <!-- Roles Selection -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-shield-check me-1"></i>Assign Roles
                        </label>
                        <div class="row">
                            <div th:each="role : ${allRoles}" class="col-md-6 mb-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" 
                                           th:id="'role_' + ${role.name}" 
                                           name="roleNames" 
                                           th:value="${role.name}">
                                    <label class="form-check-label fw-semibold" th:for="'role_' + ${role.name}">
                                        <span th:switch="${role.name}">
                                            <span th:case="'ADMIN'">🛡️ Administrator</span>
                                            <span th:case="'DEVELOPER'">💻 Developer</span>
                                            <span th:case="'QA'">🔍 QA Engineer</span>
                                            <span th:case="*" th:text="${role.name}"></span>
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="form-text">If no roles are selected, USER role will be assigned by default</div>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a th:href="@{/admin/users}" class="btn btn-back text-white me-md-2">
                            <i class="bi bi-arrow-left me-2"></i>Back to Users
                        </a>
                        <button type="submit" class="btn btn-create text-white">
                            <i class="bi bi-person-plus me-2"></i>Create User
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('createUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const messageContainer = document.getElementById('message-container');
            
            try {
                const response = await fetch('/admin/users/create', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    messageContainer.innerHTML = `
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <strong>Success!</strong> User created successfully.
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    `;
                    this.reset(); // Clear form
                    
                    // Redirect to users page after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/admin/users';
                    }, 2000);
                } else {
                    messageContainer.innerHTML = `
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <strong>Error!</strong> ${result.message}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    `;
                }
            } catch (error) {
                messageContainer.innerHTML = `
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <strong>Error!</strong> Failed to create user. Please try again.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
